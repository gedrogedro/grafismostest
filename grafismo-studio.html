<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafismo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Bagel+Fat+One&family=Chango&family=Shrikhand&family=DM+Serif+Display&family=Unbounded:wght@800&family=Fraunces:wght@900&family=Syne:wght@800&family=Rammetto+One&family=Bungee&family=Lilita+One&family=Titan+One&family=Modak&family=Gloock&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16130f;--panel:#1f1b16;--panel2:#2a251e;--line:#3a332a;--tx:#f3ebdd;--mut:#a89d8a;--acc:#ff5a2b;--acc2:#ffc531;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 Inter,system-ui,Segoe UI,sans-serif}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:800 15px Syne,Inter,sans-serif;letter-spacing:.04em;margin-right:8px}
.brand i{font-style:normal;color:var(--acc)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--mut)}
button.pri{background:var(--acc);border-color:var(--acc);color:#1a0d05;font-weight:600}
button.sec{background:var(--acc2);border-color:var(--acc2);color:#2a1d00;font-weight:600}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=number]{width:90px}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
#view{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px;background:
 conic-gradient(#1c1914 25%,#211d17 0 50%,#1c1914 0 75%,#211d17 0) 0 0/24px 24px}
#cv{box-shadow:0 10px 50px #000a;background:#fff}
#tl{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line)}
#tl input[type=range]{flex:1}
#panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line)}
.sec{border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel);z-index:2}
.sh b{flex:1;font-weight:600}
.sh .lk{font-size:11px;color:var(--mut);display:flex;gap:4px;align-items:center}
.sh .ch{transition:.15s;color:var(--mut)}
.sec.closed .ch{transform:rotate(-90deg)}
.sec.closed .sb{display:none}
.sb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;flex-direction:column;gap:2px}
.row label{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.row label output{color:var(--tx);font-variant-numeric:tabular-nums}
.row.b{flex-direction:row;align-items:center;gap:8px}
.row.b label{color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--acc)}
h4{margin:8px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2)}
.pal{display:flex;gap:6px}
.pal button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.pe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pe input{width:100%;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.btns{display:flex;gap:6px;flex-wrap:wrap}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.g2 label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
#prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
#prog i{display:block;height:100%;width:0;background:var(--acc)}
#msg{color:var(--mut);font-size:12px;min-height:16px;margin-top:6px}
.hint{color:var(--mut);font-size:11px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#panel{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">GRAFISMO<i>·</i>STUDIO</div>
  <button id="bPlay">⏸ Pausar</button>
  <div class="sep"></div>
  <button id="bSoft" class="sec" title="Atalho: R">🎲 Randomizar leve</button>
  <button id="bHard" class="pri" title="Atalho: Shift+R">⚡ Agressivo</button>
  <input id="seed" type="text" placeholder="seed" style="width:110px" title="Deixe vazio para seed aleatória; digite uma seed para repetir um resultado">
  <button id="bUndo" title="Ctrl+Z">↶ Desfazer</button>
  <div class="sep"></div>
  <select id="preset"></select>
  <button id="bSave">Salvar .json</button>
  <button id="bLoad">Abrir .json</button>
  <div class="sep"></div>
  <select id="pq" title="Qualidade da prévia"><option value="0.6">Prévia rápida</option><option value="1" selected>Prévia normal</option><option value="2">Prévia nítida</option></select>
  <span style="flex:1"></span>
  <button id="bExport" class="pri">⬇ Exportar</button>
</header>
<main>
  <section id="stage">
    <div id="view"><canvas id="cv"></canvas></div>
    <div id="tl"><span id="tcur" class="hint" style="width:90px">0.0s</span><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><span class="hint">loop</span></div>
  </section>
  <aside id="panel"></aside>
</main>
</div>

<dialog id="dlg">
  <h3>Exportar</h3>
  <h4>Imagem estática (quadro atual)</h4>
  <div class="g2">
    <label>Lado maior (px)<select id="sLong"><option>1080</option><option>1620</option><option selected>2160</option><option>3840</option><option>5400</option><option>7680</option></select></label>
    <label>Formato<select id="sFmt"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></label>
  </div>
  <button id="bPng" class="pri">Exportar imagem</button>
  <h4 style="margin-top:16px">Vídeo (loop perfeito)</h4>
  <div class="g2">
    <label>Lado maior (px)<select id="vLong"><option>720</option><option selected>1080</option><option>1440</option><option>2160</option></select></label>
    <label>FPS<select id="vFps"><option>24</option><option selected>30</option><option>60</option></select></label>
    <label>Repetições do loop<select id="vLoops"><option selected>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <label>Qualidade<select id="vQ"><option value="0.1">Alta</option><option value="0.2" selected>Muito alta</option><option value="0.35">Máxima</option></select></label>
  </div>
  <div class="btns"><button id="bVid" class="pri">Gravar vídeo</button><button id="bCancel">Cancelar gravação</button><button id="bClose">Fechar</button></div>
  <div id="prog"><i></i></div>
  <div id="msg"></div>
  <p class="hint">Vídeo: MP4 (H.264) quadro a quadro via WebCodecs, sem perder frames, mesmo que a renderização seja lenta. Se o navegador não suportar, cai para WebM.</p>
</dialog>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="fJson" accept=".json" hidden>

<script>
'use strict';
/* ================= utils ================= */
const TAU=Math.PI*2;
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const mod=(i,k)=>((i%k)+k)%k;
const hash=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7+11.3)*43758.5453;return x-Math.floor(x)};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const rgbToHex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function hsl(h,s,l){h=mod(h,360);s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgbToHex([f(0)*255,f(8)*255,f(4)*255])}
function rgbToHsl(rgb){let[r,g,b]=rgb.map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
const lum=c=>(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
const deep=o=>JSON.parse(JSON.stringify(o));
function merge(t,p){for(const k in p){if(p[k]&&typeof p[k]==='object'&&!Array.isArray(p[k]))merge(t[k],p[k]);else if(Array.isArray(p[k])&&k!=='palette')p[k].forEach((v,i)=>{if(v&&typeof v==='object')merge(t[k][i],v);else t[k][i]=v});else t[k]=p[k]}return t}

 if(def.t==='range'){const out=document.createElement('output');lab.appendChild(out);const inp=document.createElement('input');inp.type='range';inp.step=def.step;row.appendChild(inp);e.inp=inp;
  inp.addEventListener('input',()=>{beginEdit();setp(def.path,+inp.value);changed()});inp.addEventListener('change',()=>editing=false);
  e.sync=()=>{def.dyn&&def.dyn(e);const[lo,hi]=def.bounds?def.bounds():[def.min,def.max];inp.min=lo;inp.max=hi;const v=clamp(getp(def.path),lo,hi);inp.value=v;out.textContent=(+v).toFixed(def.step<1?(def.step<.1?2:1):0)}}
 else if(def.t==='sel'){const s=document.createElement('select');row.appendChild(s);e.inp=s;
  s.addEventListener('change',()=>{pushHist();const cur=getp(def.path);setp(def.path,typeof cur==='number'?+s.value:s.value);changed()});
  e.sync=()=>{const opts=typeof def.options==='function'?def.options():def.options;s.innerHTML='';opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});s.value=getp(def.path)}}
 else if(def.t==='bool'){row.className='row b';const c=document.createElement('input');c.type='checkbox';row.insertBefore(c,lab);e.inp=c;c.addEventListener('change',()=>{pushHist();setp(def.path,c.checked);changed()});e.sync=()=>{c.checked=!!getp(def.path)}}
 else if(def.t==='text'){const t=document.createElement('input');t.type='text';row.appendChild(t);e.inp=t;t.addEventListener('input',()=>{beginEdit();setp(def.path,t.value);dirty=true});t.addEventListener('change',()=>editing=false);e.sync=()=>{t.value=getp(def.path)}}
 else if(def.t==='pal'){const box=document.createElement('div');box.className='pal';row.appendChild(box);const bs=[];
  for(let j=0;j<6;j++){const b=document.createElement('button');b.title='Cor '+(j+1);b.addEventListener('click',()=>{pushHist();setp(def.path,j);refreshAll()});box.appendChild(b);bs.push(b)}
  e.sync=()=>{const v=getp(def.path);bs.forEach((b,j)=>{b.style.background=state.palette[j];b.classList.toggle('on',j===v)})}}
 secEl.appendChild(row);REG.push(e);return e;
}
function buildPanel(){
 const panel=$('#panel');panel.innerHTML='';
 SEC_DEFS.forEach(sd=>{
  const sec=document.createElement('div');sec.className='sec'+(sd.open?'':' closed');
  const sh=document.createElement('div');sh.className='sh';sh.innerHTML=`<span class="ch">▾</span><b>${sd.title}</b><label class="lk" title="Excluir esta seção da randomização"><input type="checkbox"> travar</label>`;
  sh.addEventListener('click',ev=>{if(ev.target.closest('.lk'))return;sec.classList.toggle('closed')});
  sh.querySelector('input').addEventListener('change',ev=>{ev.target.checked?locked.add(sd.id):locked.delete(sd.id)});
  const sb=document.createElement('div');sb.className='sb';sec.append(sh,sb);panel.appendChild(sec);
  if(sd.custom==='palette'){
   sb.innerHTML=`<div class="pe"></div><select id="palPre"></select><div class="btns"><button id="palGen">Gerar paleta</button><button id="palShuf">Embaralhar</button></div>`;
   const pe=$('.pe',sb),pre=$('#palPre',sb);
   for(let j=0;j<6;j++){const c=document.createElement('input');c.type='color';c.addEventListener('input',()=>{beginEdit();state.palette[j]=c.value;refreshAll()});c.addEventListener('change',()=>editing=false);pe.appendChild(c)}
   pre.innerHTML='<option value="">Paletas prontas…</option>'+Object.keys(PALETTES).map(k=>`<option>${k}</option>`).join('');
   pre.addEventListener('change',()=>{if(pre.value){pushHist();state.palette=[...PALETTES[pre.value]];pre.value='';refreshAll()}});
   $('#palGen',sb).addEventListener('click',()=>{pushHist();state.palette=genPalette(Math.random);refreshAll()});
   $('#palShuf',sb).addEventListener('click',()=>{pushHist();state.palette.sort(()=>Math.random()-.5);refreshAll()});
   REG.push({def:{t:'x'},sync:()=>{$$('.pe input',sb).forEach((c,j)=>c.value=state.palette[j])}});
  }
  if(sd.custom==='image'){
   const d=document.createElement('div');d.className='btns';d.innerHTML='<button id="bImg" class="pri">Carregar imagem…</button><button id="bImgClr">Usar exemplo</button>';sb.appendChild(d);
   $('#bImg',sb).onclick=()=>$('#fImg').click();$('#bImgClr',sb).onclick=()=>{imgSrc=makeSample();imgVer++;dirty=true};
   const h=document.createElement('div');h.className='hint';h.textContent='Dica: arraste uma imagem para cima da prévia.';sb.appendChild(h);
  }
  if(sd.id==='T0'){}
  sd.defs.forEach(def=>{const e=mkRow(def,sb);if(e){e.def.group=sd.id}});
  if(sd.id==='T1'){const d=document.createElement('div');d.className='btns';d.innerHTML='<button id="bFont">Carregar fonte (.ttf/.otf/.woff)…</button>';sb.appendChild(d);
   const g=document.createElement('div');g.className='btns';g.innerHTML='<input type="text" id="gf" placeholder="Nome de fonte do Google Fonts" style="flex:1"><button id="bGf">Carregar</button>';sb.appendChild(g);
   $('#bFont',sb).onclick=()=>$('#fFont').click();$('#bGf',sb).onclick=()=>loadGoogleFont($('#gf',sb).value.trim())}
 });
 // grupo para cada def (para a trava)
 let gi=0;REG.forEach(e=>{});
}
function $$(s,r=document){return[...r.querySelectorAll(s)]}
function addFont(name){if(!FONTS.includes(name)){FONTS.push(name);}refreshAll()}
function loadGoogleFont(name){if(!name)return;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(name).replace(/%20/g,'+')+'&display=swap';document.head.appendChild(l);
 document.fonts.load(`40px "${name}"`).then(()=>{addFont(name);dirty=true}).catch(()=>{})}

/* ================= randomização ================= */
function genPalette(rng){
 const h0=rng()*360,schemes=[[0,25,50,180,205],[0,120,240,60,300],[0,150,210,40,330],[0,40,160,200,320],[0,180,20,200,340]],sc=schemes[Math.floor(rng()*schemes.length)];
 const dark=rng()<.3,bg=dark?hsl(h0+rng()*60,35,10+rng()*8):hsl(h0+rng()*40,35+rng()*40,86+rng()*8);
 const cs=sc.slice(0,5).map((o,i)=>hsl(h0+o+(rng()-.5)*14,68+rng()*28,i%2?42+rng()*16:55+rng()*14));
 const ink=dark?hsl(h0,20,92):hsl(h0+200,40,12+rng()*8);
 const arr=[bg,cs[0],cs[1],cs[2],cs[3],ink];if(rng()<.5)arr[5]=cs[4];return arr;
}
function jitterPalette(rng){state.palette=state.palette.map(c=>{const[h,s,l]=rgbToHsl(hexToRgb(c));return hsl(h+(rng()-.5)*26,clamp(s+(rng()-.5)*14,5,100),clamp(l+(rng()-.5)*10,4,97))})}
function randomize(mode){
 const hard=mode==='hard',inp=$('#seed'),seed=parseInt(inp.value)||Math.floor(Math.random()*1e9);inp.placeholder='última: '+seed;const rng=mulberry32(seed);
 pushHist();
 if(!locked.has('palette')){if(hard){const k=Object.keys(PALETTES);state.palette=rng()<.4?[...PALETTES[k[Math.floor(rng()*k.length)]]]:genPalette(rng)}else if(rng()<.8)jitterPalette(rng)}
 REG.forEach(e=>{
  const d=e.def;if(d.t==='x'||d.t==='head'||d.rand===false||locked.has(d.group))return;if(!hard&&d.hardOnly)return;
  const cur=getp(d.path);
  if(d.t==='range'){const[lo,hi]=d.bounds?d.bounds():[d.min,d.max],[rl,rh]=d.rr?[Math.max(lo,d.rr[0]),Math.min(hi,d.rr[1])]:[lo,hi];let v;
   if(hard){v=(d.zeroP!=null&&rng()<d.zeroP)?(d.min<=0?0:rl):lerp(rl,rh,rng())}else v=cur+(rng()+rng()-1)*(rh-rl)*.22;
   v=clamp(v,lo,hi);if(d.step>=1)v=Math.round(v);else v=Math.round(v/d.step)*d.step;setp(d.path,clamp(v,lo,hi))}
  else if(d.t==='sel'){const p=hard?1:(d.pSoft??.07);if(rng()<p){const opts=d.randOpts||(typeof d.options==='function'?d.options():d.options).map(o=>o[0]);let v=opts[Math.floor(rng()*opts.length)];if(typeof cur==='number')v=+v;setp(d.path,v);d.onSet&&d.onSet();if(d.path.endsWith('.type'))normalize()}}
  else if(d.t==='bool'){if(hard)setp(d.path,rng()<(d.pTrue??.5));else if(rng()<.04)setp(d.path,!cur)}
  else if(d.t==='pal'){if(hard)setp(d.path,Math.floor(rng()*6));else if(rng()<.12)setp(d.path,Math.floor(rng()*6))}
  else if(d.t==='text'&&hard&&d.path.endsWith('.text'))setp(d.path,WORDS[Math.floor(rng()*WORDS.length)]);
  normalize();
 });
 if(hard&&!locked.has('L0')&&!state.layers.some(L=>L.on))state.layers[0].on=true;
 normalize();refreshAll();
}

/* ================= preview, play, resize ================= */
const cv=$('#cv'),cx=cv.getContext('2d');
let playing=true,T0=performance.now(),curTime=0,pq=1;
function fitCanvas(){
 const v=$('#view'),[rw,rh]=RATIOS[state.global.ratio]||[1,1],aw=v.clientWidth-36,ah=v.clientHeight-36;let w=aw,h=aw*rh/rw;if(h>ah){h=ah;w=ah*rw/rh}
 w=Math.max(50,w);h=Math.max(50,h);cv.style.width=w+'px';cv.style.height=h+'px';const k=pq*Math.min(window.devicePixelRatio||1,1.5);
 const W=Math.round(w*k),H=Math.round(h*k);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
}
function tick(now){
 if(playing){curTime=(now-T0)/1000;dirty=true}
 if(dirty){dirty=false;fitCanvas();try{renderFrame(cx,cv.width,cv.height,curTime,'preview')}catch(err){console.error(err)}
  const lp=((curTime/state.global.loop)%1+1)%1;if(document.activeElement!==$('#scrub'))$('#scrub').value=lp;$('#tcur').textContent=curTime.toFixed(1)+'s'}
 requestAnimationFrame(tick);
}
function setPlay(p){playing=p;if(p)T0=performance.now()-curTime*1000;$('#bPlay').textContent=p?'⏸ Pausar':'▶ Tocar'}
$('#bPlay').onclick=()=>setPlay(!playing);
$('#scrub').addEventListener('input',e=>{setPlay(false);curTime=+e.target.value*state.global.loop;dirty=true});
$('#pq').onchange=e=>{pq=+e.target.value;dirty=true};
window.addEventListener('resize',()=>dirty=true);
document.fonts&&document.fonts.addEventListener('loadingdone',()=>dirty=true);

/* ================= presets / arquivos ================= */
const presetSel=$('#preset');presetSel.innerHTML='<option value="">Composições prontas…</option>'+Object.keys(PRESETS).map(k=>`<option>${k}</option>`).join('');
presetSel.onchange=()=>{const k=presetSel.value;if(!k)return;pushHist();state=merge(defaultState(),deep(PRESETS[k]));if(PRESETS[k].palette)state.palette=[...PRESETS[k].palette];presetSel.value='';normalize();refreshAll()};
$('#bUndo').onclick=undo;
function undo(){const s=hist.pop();if(!s)return;state=JSON.parse(s);normalize();refreshAll()}
$('#bSoft').onclick=()=>randomize('soft');$('#bHard').onclick=()=>randomize('hard');
$('#bSave').onclick=()=>download(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),'grafismo-preset.json');
$('#bLoad').onclick=()=>$('#fJson').click();
$('#fJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pushHist();state=merge(defaultState(),JSON.parse(await f.text()));normalize();refreshAll()}catch(err){alert('Arquivo inválido')}e.target.value=''};
$('#fImg').onchange=e=>loadImageFile(e.target.files[0]);
function loadImageFile(f){if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{setImage(im);state.image.on=true;refreshAll();URL.revokeObjectURL(u)};im.src=u}
$('#fFont').onchange=async e=>{const f=e.target.files[0];if(!f)return;const name=f.name.replace(/\.[^.]+$/,'');const ff=new FontFace(name,await f.arrayBuffer());await ff.load();document.fonts.add(ff);addFont(name);e.target.value=''};
const view=$('#view');view.addEventListener('dragover',e=>e.preventDefault());view.addEventListener('drop',e=>{e.preventDefault();loadImageFile(e.dataTransfer.files[0])});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='range'&&document.activeElement.type!=='checkbox')return;
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if(e.key==='r'||e.key==='R'){randomize(e.shiftKey?'hard':'soft')}else if(e.key===' '){e.preventDefault();setPlay(!playing)}});

/* ================= exportação ================= */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function dims(long){const[rw,rh]=RATIOS[state.global.ratio];let W,H;if(rw>=rh){W=long;H=Math.round(long*rh/rw)}else{H=long;W=Math.round(long*rw/rh)}return[W&~1,H&~1]}
const msg=t=>$('#msg').textContent=t;
$('#bExport').onclick=()=>$('#dlg').showModal();$('#bClose').onclick=()=>$('#dlg').close();
$('#bPng').onclick=async()=>{
 const[W,H]=dims(+$('#sLong').value),fmt=$('#sFmt').value;msg(`Renderizando ${W}×${H}…`);await new Promise(r=>setTimeout(r,30));
 try{const c=document.createElement('canvas');c.width=W;c.height=H;renderFrame(c.getContext('2d'),W,H,curTime,'export');
  const blob=await new Promise(r=>c.toBlob(r,'image/'+fmt,.95));if(!blob)throw new Error('canvas grande demais');download(blob,`grafismo-${W}x${H}.${fmt==='jpeg'?'jpg':fmt}`);msg('Imagem exportada ✓')}
 catch(err){msg('Erro: '+err.message+' — tente um tamanho menor.')}
};
let cancel=false;$('#bCancel').onclick=()=>cancel=true;
$('#bVid').onclick=async()=>{
 const[W,H]=dims(+$('#vLong').value),fps=+$('#vFps').value,loops=+$('#vLoops').value,bpp=+$('#vQ').value,fpl=Math.round(state.global.loop*fps),total=fpl*loops,dt=state.global.loop/fpl;
 cancel=false;const prog=$('#prog'),bar=prog.firstElementChild;prog.style.display='block';bar.style.width='0';
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),bitrate=Math.round(W*H*fps*bpp);
 const wasPlaying=playing;setPlay(false);
 try{
  let mode='webcodecs',muxer,enc,Mux;
  try{
   Mux=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs');
   let cfg=null;for(const codec of['avc1.640034','avc1.640033','avc1.64002A','avc1.4d002a']){const t={codec,width:W,height:H,bitrate,framerate:fps};if((await VideoEncoder.isConfigSupported(t)).supported){cfg=t;break}}
   if(!cfg)throw new Error('sem H.264');
   muxer=new Mux.Muxer({target:new Mux.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
   enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{throw e}});enc.configure(cfg);
  }catch(err){mode='recorder';console.warn('WebCodecs indisponível:',err)}
  if(mode==='webcodecs'){
   for(let f=0;f<total;f++){if(cancel)throw new Error('cancelado');renderFrame(x,W,H,f*dt,'export');const vf=new VideoFrame(c,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});enc.encode(vf,{keyFrame:f%(fps*2)===0});vf.close();
    while(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5));bar.style.width=(f/total*100)+'%';msg(`Quadro ${f+1}/${total} (MP4 H.264)`);if(f%4===0)await new Promise(r=>setTimeout(r,0))}
   await enc.flush();muxer.finalize();download(new Blob([muxer.target.buffer],{type:'video/mp4'}),`grafismo-${W}x${H}-${fps}fps.mp4`);
  }else{
   const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)),stream=c.captureStream(0),tr=stream.getVideoTracks()[0],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bitrate}),parts=[];
   rec.ondataavailable=e=>e.data.size&&parts.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();
   for(let f=0;f<total;f++){if(cancel)break;const t0=performance.now();renderFrame(x,W,H,f*dt,'export');tr.requestFrame();bar.style.width=(f/total*100)+'%';msg(`Quadro ${f+1}/${total} (gravador em tempo real)`);await new Promise(r=>setTimeout(r,Math.max(0,1000/fps-(performance.now()-t0))))}
   rec.stop();await done;if(cancel)throw new Error('cancelado');download(new Blob(parts,{type:mime.split(';')[0]}),`grafismo-${W}x${H}.${mime.includes('mp4')?'mp4':'webm'}`);
  }
  bar.style.width='100%';msg('Vídeo exportado ✓');
 }catch(err){msg('Interrompido: '+err.message)}
 setPlay(wasPlaying);
};

/* ================= init ================= */
buildPanel();normalize();refreshAll();pushHist();hist.length=0;
presetSel.value='Sol · Fonda (grade de tiles)';presetSel.onchange();hist.length=0;
requestAnimationFrame(tick);
</script>
</body>
